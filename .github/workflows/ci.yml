name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Valores ficticios: el build solo necesita que existan. Nunca pongas
      # aquí claves reales; para eso están los secrets del repositorio.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint en cero (Tarea 46): cualquier error o aviso nuevo frena el CI.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Pruebas de punta a punta (Tarea 45) contra el build de producción. Sin
      # Supabase real, las de login/panel se saltan solas; ninguna cambia datos.
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: npm run test:e2e
        env:
          E2E_PORT: 3100

      - name: Reporte E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
