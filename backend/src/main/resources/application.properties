spring.application.name=backend
server.port=8080

# MySQL local. La base de datos se crea sola si no existe.
# Usuario y clave: edita los valores por defecto o define DB_USERNAME / DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/carta_digital_t2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Muestra legible el SQL que genera Hibernate (incluido el CREATE TABLE al crear las tablas)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Origen del frontend Angular permitido por CORS
app.cors.allowed-origin=http://localhost:4200
